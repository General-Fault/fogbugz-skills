name: Policy Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate issue reference and test policy
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = (pr.body || '').toLowerCase();

            // Require an issue reference like #123 in PR body.
            const issueRef = body.match(/#\d+/g) || [];
            if (issueRef.length === 0) {
              core.setFailed('PR body must reference at least one issue number (example: #11).');
              return;
            }

            // Determine changed files.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            const changed = files.map(f => f.filename);
            const codeChanges = files.some(f =>
              f.status !== 'removed' &&
              (f.filename.endsWith('.ps1') || f.filename.endsWith('.psm1') || f.filename.endsWith('.psd1'))
            );

            const testChanges = changed.some(f =>
              f.toLowerCase().includes('/tests/') || f.toLowerCase().endsWith('.tests.ps1')
            );

            // Heuristic: if PowerShell code changed, require some test-file change.
            if (codeChanges && !testChanges) {
              core.setFailed('PowerShell code changed but no test file changes were detected. Add/update tests or split non-functional changes.');
              return;
            }

            core.info('Policy checks passed.');
